<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monitoring Asset Packer</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Manrope', 'system-ui', 'sans-serif'] },
          colors: {
            base: '#0a1020',
            panel: '#111a2e',
            raised: '#17233d',
            line: '#243350',
            ink: '#e6ecf7',
            muted: '#8a9bb8',
            amber: { DEFAULT: '#f5b13d' },
            mint: { DEFAULT: '#3ddc97' },
            rose: { DEFAULT: '#ff6b7a' },
            sky: { DEFAULT: '#6ea8ff' }
          }
        }
      }
    };
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

  <style>
    html, body { background: #0a1020; }
    body {
      color: #e6ecf7;
      font-family: 'Manrope', system-ui, sans-serif;
      background-image: radial-gradient(900px 420px at 85% -10%, rgba(110,168,255,.10), transparent 60%);
      background-attachment: fixed;
    }
    .num { font-variant-numeric: tabular-nums; }

    /* ---------- Kontrol form ---------- */
    .field {
      width: 100%;
      background: #0d1629;
      border: 1px solid #243350;
      border-radius: 12px;
      padding: 12px 14px;
      color: #e6ecf7;
      font-size: 15px;
      transition: border-color .15s, box-shadow .15s;
    }
    .field::placeholder { color: #5d6f8f; }
    .field:focus { outline: none; border-color: #6ea8ff; box-shadow: 0 0 0 3px rgba(110,168,255,.18); }

    .seg { display: grid; gap: 6px; background: #0d1629; border: 1px solid #243350; border-radius: 14px; padding: 5px; }
    .seg button {
      border-radius: 10px; padding: 10px 6px; font-weight: 600; font-size: 14px; color: #8a9bb8;
      transition: background .15s, color .15s, box-shadow .15s;
    }
    .seg button:hover { color: #e6ecf7; }
    .seg button:focus-visible, .tab:focus-visible, .btn-save:focus-visible, .btn-ghost:focus-visible, #modalOk:focus-visible {
      outline: 2px solid #6ea8ff; outline-offset: 2px;
    }
    .seg button.on-jenis { background: #1d2c4b; color: #e6ecf7; box-shadow: inset 0 0 0 1px #3a5384; }
    .seg button.on-pinjam { background: rgba(245,177,61,.16); color: #f5b13d; box-shadow: inset 0 0 0 1px rgba(245,177,61,.55); }
    .seg button.on-kembali { background: rgba(61,220,151,.14); color: #3ddc97; box-shadow: inset 0 0 0 1px rgba(61,220,151,.5); }

    /* ---------- Tombol simpan + loading ---------- */
    .btn-save {
      width: 100%; border-radius: 14px; padding: 14px 16px; font-weight: 700; font-size: 15px;
      background: linear-gradient(180deg, #7db3ff, #5a93f0); color: #07101f;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: transform .12s, filter .15s, box-shadow .2s;
    }
    .btn-save:hover:not(:disabled) { filter: brightness(1.06); }
    .btn-save:active:not(:disabled) { transform: scale(.985); }
    .btn-save:disabled { cursor: wait; }
    .btn-save.is-loading { animation: btnPulse 1.4s ease-in-out infinite; background: linear-gradient(180deg, #6a9fe8, #4f84d6); }
    @keyframes btnPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(110,168,255,.45); }
      50% { box-shadow: 0 0 0 10px rgba(110,168,255,0); }
    }
    .spinner { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid rgba(7,16,31,.28); border-top-color: #07101f; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .btn-ghost {
      border: 1px solid #243350; border-radius: 12px; padding: 8px 12px; font-size: 13px; font-weight: 600; color: #b9c6dd;
      display: inline-flex; align-items: center; gap: 8px; transition: background .15s, border-color .15s;
    }
    .btn-ghost:hover { background: #17233d; border-color: #3a5384; }

    /* ---------- Tab filter ---------- */
    .tab {
      display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 12px;
      border: 1px solid #243350; background: #0d1629; color: #8a9bb8; font-weight: 600; font-size: 14px;
      transition: background .15s, color .15s, border-color .15s;
    }
    .tab:hover { color: #e6ecf7; }
    .tab .count { min-width: 24px; text-align: center; padding: 1px 7px; border-radius: 999px; background: #17233d; font-size: 12px; color: #b9c6dd; }
    .tab.active { background: #1d2c4b; border-color: #3a5384; color: #e6ecf7; }
    .tab.active .count { background: #f5b13d; color: #1b1203; }

    /* ---------- Tabel ---------- */
    .tbl { width: 100%; border-collapse: collapse; }
    .tbl th { text-align: left; font-size: 12.5px; font-weight: 600; color: #8a9bb8; padding: 10px 14px; border-bottom: 1px solid #243350; white-space: nowrap; }
    .tbl td { padding: 14px; border-bottom: 1px solid #1a2742; vertical-align: top; }
    .tbl tbody tr:last-child td { border-bottom: 0; }
    .tbl tbody tr { transition: background .15s; }
    .tbl tbody tr:hover { background: rgba(110,168,255,.05); }
    .badge { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #17233d; color: #b9c6dd; }

    .dur { font-weight: 700; font-size: 15px; white-space: nowrap; }
    .dur-ok { color: #3ddc97; }
    .dur-warn { color: #f5b13d; }
    .dur-late { color: #ff6b7a; }

    .chip { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 12px; border: 1px solid #243350; background: #0d1629; min-width: 150px; }
    .chip.out { border-color: rgba(255,107,122,.5); background: rgba(255,107,122,.08); }
    .chip.back { border-color: rgba(61,220,151,.4); background: rgba(61,220,151,.07); }
    .chip.none { border-style: dashed; color: #8a9bb8; }

    .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #3ddc97; }
    .sync-dot.loading { background: #f5b13d; animation: dotPulse 1s ease-in-out infinite; }
    .sync-dot.error { background: #ff6b7a; }
    @keyframes dotPulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }

    .skeleton { background: linear-gradient(90deg, #131f38 25%, #1a2a49 50%, #131f38 75%); background-size: 200% 100%; animation: shimmer 1.3s infinite; border-radius: 8px; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* ---------- Modal kustom ---------- */
    .modal { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .modal.hidden { display: none; }
    .modal-backdrop { position: absolute; inset: 0; background: rgba(4,8,18,.72); backdrop-filter: blur(5px); animation: fadeIn .2s ease-out both; }
    .modal-card {
      position: relative; width: 100%; max-width: 400px; background: #111a2e; border: 1px solid #243350; border-radius: 22px;
      padding: 28px 24px 22px; text-align: center; box-shadow: 0 30px 80px rgba(0,0,0,.55);
      animation: popIn .38s cubic-bezier(.2,.9,.3,1.25) both;
    }
    .modal.closing .modal-backdrop { animation: fadeOut .22s ease-in both; }
    .modal.closing .modal-card { animation: cardOut .22s ease-in both; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
    @keyframes popIn { 0% { opacity: 0; transform: scale(.8) translateY(14px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
    @keyframes cardOut { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(.94) translateY(6px); } }

    .icon-wrap { width: 76px; height: 76px; border-radius: 50%; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; position: relative; }
    .icon-wrap::after { content: ''; position: absolute; inset: -8px; border-radius: 50%; border: 2px solid currentColor; opacity: 0; animation: ring .9s .25s ease-out both; }
    @keyframes ring { 0% { opacity: .55; transform: scale(.8); } 100% { opacity: 0; transform: scale(1.25); } }
    .icon-success { background: rgba(61,220,151,.14); color: #3ddc97; }
    .icon-error { background: rgba(255,107,122,.14); color: #ff6b7a; animation: shake .5s .3s both; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
    .draw { stroke-dasharray: 34; stroke-dashoffset: 34; animation: draw .45s .22s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    .detail { margin-top: 16px; text-align: left; background: #0d1629; border: 1px solid #243350; border-radius: 14px; padding: 6px 14px; }
    .detail div { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid #1a2742; font-size: 13.5px; }
    .detail div:last-child { border-bottom: 0; }
    .detail dt { color: #8a9bb8; }
    .detail dd { font-weight: 600; text-align: right; }

    #modalOk { margin-top: 20px; width: 100%; padding: 13px; border-radius: 14px; font-weight: 700; font-size: 15px; transition: filter .15s, transform .12s; }
    #modalOk:hover { filter: brightness(1.08); }
    #modalOk:active { transform: scale(.985); }
    #modalOk.ok-success { background: #3ddc97; color: #04170d; }
    #modalOk.ok-error { background: #ff6b7a; color: #1d0509; }

    /* ---------- Scanner kamera ---------- */
    .id-row { display: flex; gap: 8px; }
    .btn-cam {
      flex: 0 0 48px; width: 48px; border-radius: 12px; border: 1px solid #3a5384; background: #1d2c4b; color: #6ea8ff;
      display: flex; align-items: center; justify-content: center; transition: background .15s, transform .12s;
    }
    .btn-cam:hover { background: #24375d; }
    .btn-cam:active { transform: scale(.95); }
    .btn-cam:focus-visible { outline: 2px solid #6ea8ff; outline-offset: 2px; }
    .btn-cam:disabled { opacity: .5; cursor: wait; }

    .scan-overlay { position: fixed; inset: 0; z-index: 70; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .scan-overlay.hidden { display: none; }
    .scan-backdrop { position: absolute; inset: 0; background: rgba(4,8,18,.82); backdrop-filter: blur(5px); animation: fadeIn .2s ease-out both; }
    .scan-card {
      position: relative; width: 100%; max-width: 440px; background: #111a2e; border: 1px solid #243350; border-radius: 22px;
      padding: 18px; box-shadow: 0 30px 80px rgba(0,0,0,.55); animation: popIn .3s cubic-bezier(.2,.9,.3,1.2) both;
    }
    .scan-overlay.closing .scan-backdrop { animation: fadeOut .2s ease-in both; }
    .scan-overlay.closing .scan-card { animation: cardOut .2s ease-in both; }
    #reader { width: 100%; min-height: 260px; border-radius: 16px; overflow: hidden; background: #000; border: 1px solid #243350 !important; }
    #reader video { width: 100% !important; object-fit: cover; }
    .scan-line { position: absolute; left: 10%; right: 10%; height: 2px; background: #ff6b7a; box-shadow: 0 0 12px #ff6b7a; border-radius: 2px; pointer-events: none; animation: scanMove 2s ease-in-out infinite; }
    @keyframes scanMove { 0%, 100% { top: 30%; } 50% { top: 62%; } }
    .chk { display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: #b9c6dd; cursor: pointer; user-select: none; }
    .chk input { width: 18px; height: 18px; accent-color: #6ea8ff; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>

<body class="min-h-screen font-sans antialiased">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 py-6 sm:py-8">

    <!-- Header -->
    <header class="flex flex-wrap items-center justify-between gap-3 mb-6">
      <div>
        <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">Monitoring Asset Packer</h1>
        <p class="text-muted text-sm mt-1">Cutter, dispenser, dan lakban yang sedang dipinjam, terhubung langsung ke Google Sheets.</p>
      </div>
      <div class="flex items-center gap-3">
        <div class="flex items-center gap-2 text-sm text-muted" aria-live="polite">
          <span id="syncDot" class="sync-dot loading"></span>
          <span id="syncText">Menghubungkan…</span>
        </div>
        <button id="btnRefresh" type="button" class="btn-ghost" aria-label="Muat ulang data">
          <svg id="refreshIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          Muat ulang
        </button>
      </div>
    </header>

    <div class="grid lg:grid-cols-[380px_minmax(0,1fr)] gap-6 items-start">

      <!-- ===================== FORM SCAN ===================== -->
      <section class="bg-panel border border-line rounded-3xl p-5 sm:p-6 lg:sticky lg:top-6" aria-labelledby="formTitle">
        <h2 id="formTitle" class="text-lg font-bold mb-4">Catat peminjaman</h2>

        <div class="space-y-4">
          <div>
            <label class="block text-sm font-semibold text-muted mb-2">Jenis asset</label>
            <div id="segJenis" class="seg grid-cols-3" role="group" aria-label="Jenis asset">
              <button type="button" data-value="cutter" class="on-jenis" aria-pressed="true">Cutter</button>
              <button type="button" data-value="dispenser" aria-pressed="false">Dispenser</button>
              <button type="button" data-value="lakban" aria-pressed="false">Lakban</button>
            </div>
          </div>

          <div>
            <label class="block text-sm font-semibold text-muted mb-2">Status</label>
            <div id="segAksi" class="seg grid-cols-2" role="group" aria-label="Status aksi">
              <button type="button" data-value="PINJAM" class="on-pinjam" aria-pressed="true">Pinjam</button>
              <button type="button" data-value="KEMBALI" aria-pressed="false">Kembali</button>
            </div>
          </div>

          <div>
            <label for="inpId" class="block text-sm font-semibold text-muted mb-2">ID asset</label>
            <div class="id-row">
              <input id="inpId" class="field" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Scan atau ketik ID, misal CTR-014">
              <button id="btnCamera" type="button" class="btn-cam" aria-label="Scan dengan kamera belakang" title="Scan dengan kamera belakang">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2"/><path d="M16 4h2a2 2 0 0 1 2 2v2"/><path d="M20 16v2a2 2 0 0 1-2 2h-2"/><path d="M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg>

            </div>
            <label class="chk mt-3"><input id="chkAuto" type="checkbox"> Langsung simpan setelah scan kamera</label>
          </div>

      <!-- ===================== LIVE MONITORING ===================== -->
      <section class="min-w-0 space-y-4" aria-labelledby="monTitle">

            <h2 id="monTitle" class="text-lg font-bold">Sedang dipinjam</h2>
            <div id="tabs" class="flex flex-wrap gap-2" role="tablist" aria-label="Filter kategori"></div>

          <!-- Smart Search -->

              <svg class="absolute left-3.5 top-3.5 text-muted" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>

  <!-- ===================== SCANNER KAMERA ===================== -->

    <div class="scan-card">
      <div class="flex items-center justify-between mb-3">

        <div id="reader"></div>
        <div id="scanLine" class="scan-line hidden"></div>

  <!-- ===================== MODAL ===================== -->

    <div class="modal-card">
      <div id="modalIcon"></div>
      <h3 id="modalTitle" class="text-xl font-extrabold"></h3>
      <p id="modalMsg" class="text-muted text-sm mt-2 leading-relaxed"></p>
      <dl id="modalDetail" class="detail hidden"></dl>
      <button id="modalOk" type="button">OK</button>
    </div>

  <script>
    /* =====================================================================
     * KONFIGURASI
     * - API_URL = URL Web App Apps Script (.../exec), dipakai saat index.html
     *   di-host di luar Apps Script (misal GitHub Pages).
     * - Kamera HP hanya bisa dipakai di halaman HTTPS yang tidak berada di dalam
     *   iframe Apps Script, jadi gunakan hosting luar (GitHub Pages) untuk scan.
     * ===================================================================== */
    const API_URL = 'https://script.google.com/macros/s/AKfycbzTXWr4IpU12DljgwYgUUo-SU3SCvAw1WxsjaqMnnVkOXhybCfofwbdS6bNHgDjfh-b/exec';
    const AUTO_REFRESH_MS = 30000;
    const LATE_WARN_MS = 4 * 3600 * 1000;
    const LATE_DANGER_MS = 24 * 3600 * 1000;

    const JENIS_LABEL = { cutter: 'Cutter', dispenser: 'Dispenser', lakban: 'Lakban' };
    const TAB_ORDER = ['cutter', 'dispenser', 'lakban', 'all'];

    const state = {
      assets: [],
      offset: 0,
      filter: 'cutter',
      jenis: 'cutter',
      aksi: 'PINJAM',
      query: '',
      busy: false,
      loading: false,
      loadedOnce: false
    };

    const $ = (id) => document.getElementById(id);
    const USE_GAS = typeof google !== 'undefined' && google.script && google.script.run;

    /* ------------------------- API layer ------------------------- */
    function callGas(fnName, payload) {
      return new Promise((resolve, reject) => {
        const runner = google.script.run.withSuccessHandler(resolve).withFailureHandler((err) => reject(new Error(err && err.message ? err.message : 'Gagal menghubungi server.')));
        if (payload === undefined) runner[fnName](); else runner[fnName](payload);
      });
    }

    async function apiGetData() {
      if (USE_GAS) return callGas('apiGetData');
      if (!API_URL) throw new Error('API_URL belum diisi.');
      const res = await fetch(API_URL + '?action=getData&_=' + Date.now());
      if (!res.ok) throw new Error('Server membalas HTTP ' + res.status + '.');
      return res.json();
    }

    async function apiScan(payload) {
      if (USE_GAS) return callGas('apiScan', payload);
      if (!API_URL) throw new Error('API_URL belum diisi.');
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ action: 'scan' }, payload))
      });
      if (!res.ok) throw new Error('Server membalas HTTP ' + res.status + '.');
      return res.json();
    }

    /* ------------------------- Utilitas ------------------------- */
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function pad(n) { return String(n).padStart(2, '0'); }
    function fmtDur(ms) {
      const t = Math.max(0, Math.floor(ms / 1000));
      const d = Math.floor(t / 86400);
      const h = Math.floor((t % 86400) / 3600);
      const m = Math.floor((t % 3600) / 60);
      const s = t % 60;
      return (d > 0 ? d + ' hari ' : '') + pad(h) + ':' + pad(m) + ':' + pad(s);
    }
    function fmtDateParts(ms) {
      const d = new Date(ms);
      const date = d.toLocaleDateString('id-ID', { timeZone: 'Asia/Jakarta', day: '2-digit', month: 'short', year: 'numeric' });
      const time = d.toLocaleTimeString('id-ID', { timeZone: 'Asia/Jakarta', hour: '2-digit', minute: '2-digit', hour12: false }).replace('.', ':');
      return { date, time };
    }
    function nowMs() { return Date.now() + state.offset; }
    function tokensFromQuery() {
      const seen = new Set();
      return state.query.split(/[\s,;]+/).map((t) => t.trim().toUpperCase()).filter((t) => t && !seen.has(t) && seen.add(t));
    }
    function store(key, val) { try { localStorage.setItem(key, val); } catch (e) { /* diabaikan */ } }
    function load(key) { try { return localStorage.getItem(key) || ''; } catch (e) { return ''; } }

    /* ------------------------- Modal kustom ------------------------- */
    let modalCloseTimer = null;
    let lastFocus = null;

    function showModal(opts) {
      const type = opts.type === 'success' ? 'success' : 'error';
      lastFocus = document.activeElement;
      clearTimeout(modalCloseTimer);

      const iconSvg = type === 'success'
        ? '<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path class="draw" d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
        : '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path class="draw" d="M7 7l10 10"/><path class="draw" d="M17 7L7 17"/></svg>';

      $('modalIcon').innerHTML = '<div class="icon-wrap icon-' + type + '">' + iconSvg + '</div>';
      $('modalTitle').textContent = opts.title;
      $('modalMsg').textContent = opts.message;

      const dl = $('modalDetail');
      if (opts.details && opts.details.length) {
        dl.innerHTML = opts.details.map((d) => '<div><dt>' + esc(d[0]) + '</dt><dd>' + esc(d[1]) + '</dd></div>').join('');
        dl.classList.remove('hidden');
      } else {
        dl.innerHTML = '';
        dl.classList.add('hidden');
      }

      const ok = $('modalOk');
      ok.className = 'ok-' + type;
      ok.textContent = type === 'success' ? 'Selesai' : 'Tutup';

      const modal = $('modal');
      modal.classList.remove('closing', 'hidden');
      ok.focus();
    }

    function closeModal() {
      const modal = $('modal');
      if (modal.classList.contains('hidden') || modal.classList.contains('closing')) return;
      modal.classList.add('closing');
      modalCloseTimer = setTimeout(() => {
        modal.classList.add('hidden');
        modal.classList.remove('closing');
        if (lastFocus && typeof lastFocus.focus === 'function') lastFocus.focus();
      }, 230);
    }

    $('modalOk').addEventListener('click', closeModal);
    $('modalBackdrop').addEventListener('click', closeModal);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    /* ------------------------- Sinkronisasi ------------------------- */
    function setSync(mode, text) {
      $('syncDot').className = 'sync-dot ' + (mode === 'ok' ? '' : mode);
      $('syncText').textContent = text;
    }

    async function loadData(silent) {
      if (state.loading) return;
      state.loading = true;
      setSync('loading', 'Menyinkronkan…');
      $('refreshIcon').style.animation = 'spin .8s linear infinite';
      if (!state.loadedOnce) renderSkeleton();

      try {
        const res = await apiGetData();
        if (!res || !res.success) throw new Error(res && res.message ? res.message : 'Gagal memuat data.');
        state.assets = res.assets || [];
        state.offset = (res.serverTime || Date.now()) - Date.now();
        state.loadedOnce = true;
        const t = new Date();
        setSync('ok', 'Tersinkron ' + pad(t.getHours()) + ':' + pad(t.getMinutes()) + ':' + pad(t.getSeconds()));
        refreshSuggestions();
        render();
      } catch (err) {
        setSync('error', 'Gagal sinkron');
        if (!state.loadedOnce) {
          renderLoadError(err.message);
        } else if (!silent) {
          showModal({ type: 'error', title: 'Gagal memuat data', message: err.message });
        }
      } finally {
        state.loading = false;
        $('refreshIcon').style.animation = '';
      }
    }

    function refreshSuggestions() {
      const users = new Set();
      const zonas = new Set();
      state.assets.forEach((a) => {
        if (a.user) users.add(a.user);
        if (a.zona) zonas.add(a.zona);
      });
      $('dlUser').innerHTML = Array.from(users).sort().map((u) => '<option value="' + esc(u) + '">').join('');
      $('dlZona').innerHTML = Array.from(zonas).sort().map((z) => '<option value="' + esc(z) + '">').join('');
    }

    /* ------------------------- Render ------------------------- */
    function borrowedList() {
      return state.assets.filter((a) => a.status === 'PINJAM');
    }

    function renderTabs() {
      const borrowed = borrowedList();
      $('tabs').innerHTML = TAB_ORDER.map((key) => {
        const count = key === 'all' ? borrowed.length : borrowed.filter((a) => a.jenis === key).length;
        const label = key === 'all' ? 'Semua' : JENIS_LABEL[key];
        const active = state.filter === key;
        return '<button type="button" role="tab" aria-selected="' + active + '" class="tab' + (active ? ' active' : '') + '" data-filter="' + key + '">' +
          esc(label) + '<span class="count num">' + count + '</span></button>';
      }).join('');
    }

    function renderSkeleton() {
      $('emptyState').classList.add('hidden');
      $('tbody').innerHTML = [0, 1, 2, 3].map(() =>
        '<tr><td><div class="skeleton" style="height:16px;width:140px"></div><div class="skeleton mt-2" style="height:12px;width:100px"></div></td>' +
        '<td><div class="skeleton" style="height:14px;width:100px"></div></td>' +
        '<td><div class="skeleton" style="height:16px;width:90px"></div></td></tr>').join('');
    }

    function renderLoadError(msg) {
      $('tbody').innerHTML = '';
      $('emptyState').classList.remove('hidden');
      $('emptyTitle').textContent = 'Data belum bisa dimuat';
      $('emptyText').textContent = msg + ' Tekan "Muat ulang" untuk mencoba lagi.';
    }

    function renderTable() {
      const tokens = tokensFromQuery();
      let rows = borrowedList().filter((a) => state.filter === 'all' || a.jenis === state.filter);

      if (tokens.length) {
        rows = rows.filter((a) => {
          const hay = (a.id + ' ' + a.user + ' ' + a.zona).toUpperCase();
          return tokens.some((t) => hay.indexOf(t) !== -1);
        });
      }

      const tbody = $('tbody');
      const empty = $('emptyState');

      if (!rows.length) {
        tbody.innerHTML = '';
        empty.classList.remove('hidden');
        if (tokens.length) {
          $('emptyTitle').textContent = 'Tidak ada hasil yang cocok';
          $('emptyText').textContent = 'Tidak ada asset yang sedang dipinjam dengan kata kunci tersebut pada filter ini.';
        } else {
          const nama = state.filter === 'all' ? 'asset' : JENIS_LABEL[state.filter];
          $('emptyTitle').textContent = 'Tidak ada ' + nama + ' yang sedang dipinjam';
          $('emptyText').textContent = 'Semua sudah kembali. Peminjaman baru akan muncul di sini.';
        }
        return;
      }

      empty.classList.add('hidden');
      tbody.innerHTML = rows.map((a) => {
        const p = fmtDateParts(a.borrowTs);
        return '<tr>' +
          '<td><div class="flex items-center gap-2 flex-wrap"><span class="font-bold text-[15px]">' + esc(a.id) + '</span>' +
          (state.filter === 'all' ? '<span class="badge">' + esc(JENIS_LABEL[a.jenis] || a.jenis) + '</span>' : '') + '</div>' +
          '<div class="text-sm text-muted mt-1">' + esc(a.user || '-') + ' di ' + esc(a.zona || '-') + '</div></td>' +
          '<td class="whitespace-nowrap"><div class="text-sm font-semibold">' + esc(p.date) + '</div><div class="text-sm text-muted num">' + esc(p.time) + ' WIB</div></td>' +
          '<td><span class="dur num" data-ts="' + a.borrowTs + '">00:00:00</span></td>' +
          '</tr>';
      }).join('');
    }

    function renderTrack() {
      const tokens = tokensFromQuery();
      const panel = $('trackPanel');
      const map = new Map(state.assets.map((a) => [a.id, a]));
      const show = tokens.length >= 2 || (tokens.length === 1 && map.has(tokens[0]));

      if (!show) {
        panel.classList.add('hidden');
        return;
      }

      let out = 0, back = 0, none = 0;
      const chips = tokens.map((t) => {
        const a = map.get(t);
        if (!a) {
          none++;
          return '<div class="chip none"><span class="font-bold text-ink">' + esc(t) + '</span><span class="text-xs">Tidak ditemukan</span></div>';
        }
        const label = JENIS_LABEL[a.jenis] || a.jenis;
        if (a.status === 'PINJAM') {
          out++;
          return '<div class="chip out"><span class="font-bold">' + esc(a.id) + ' <span class="badge">' + esc(label) + '</span></span>' +
            '<span class="text-xs text-rose font-semibold">Belum kembali</span>' +
            '<span class="text-xs text-muted">' + esc(a.user || '-') + ' di ' + esc(a.zona || '-') + '</span>' +
            '<span class="dur dur-late num text-xs" data-ts="' + a.borrowTs + '">00:00:00</span></div>';
        }
        back++;
        const p = fmtDateParts(a.lastTs);
        return '<div class="chip back"><span class="font-bold">' + esc(a.id) + ' <span class="badge">' + esc(label) + '</span></span>' +
          '<span class="text-xs text-mint font-semibold">Sudah kembali</span>' +
          '<span class="text-xs text-muted num">' + esc(p.date) + ' ' + esc(p.time) + '</span></div>';
      });

      const summary = [];
      if (out) summary.push(out + ' belum kembali');
      if (back) summary.push(back + ' sudah kembali');
      if (none) summary.push(none + ' tidak ditemukan');
      const sumEl = $('trackSummary');
      sumEl.textContent = summary.join(', ');
      sumEl.className = 'text-sm font-semibold mb-2 ' + (out ? 'text-rose' : 'text-mint');
      $('trackChips').innerHTML = chips.join('');
      panel.classList.remove('hidden');
    }

    function render() {
      renderTabs();
      renderTable();
      renderTrack();
      tick();
    }

    /* Ticker durasi real-time */
    function tick() {
      const now = nowMs();
      document.querySelectorAll('.dur').forEach((el) => {
        const ms = Math.max(0, now - Number(el.dataset.ts));
        el.textContent = fmtDur(ms);
        el.classList.remove('dur-ok', 'dur-warn', 'dur-late');
        el.classList.add(ms >= LATE_DANGER_MS ? 'dur-late' : ms >= LATE_WARN_MS ? 'dur-warn' : 'dur-ok');
      });
    }

    /* ------------------------- Interaksi form ------------------------- */
    function bindSegment(containerId, onChange) {
      $(containerId).addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-value]');
        if (!btn) return;
        onChange(btn.dataset.value);
      });
    }

    function paintSegments() {
      document.querySelectorAll('#segJenis button').forEach((b) => {
        const on = b.dataset.value === state.jenis;
        b.className = on ? 'on-jenis' : '';
        b.setAttribute('aria-pressed', on);
      });
      document.querySelectorAll('#segAksi button').forEach((b) => {
        const on = b.dataset.value === state.aksi;
        b.className = on ? (b.dataset.value === 'PINJAM' ? 'on-pinjam' : 'on-kembali') : '';
        b.setAttribute('aria-pressed', on);
      });
      const isReturn = state.aksi === 'KEMBALI';
      $('optUser').classList.toggle('hidden', !isReturn);
      $('optZona').classList.toggle('hidden', !isReturn);
    }

    bindSegment('segJenis', (v) => { state.jenis = v; paintSegments(); });
    bindSegment('segAksi', (v) => { state.aksi = v; paintSegments(); });

    $('tabs').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-filter]');
      if (!btn) return;
      state.filter = btn.dataset.filter;
      render();
    });

    $('inpSearch').addEventListener('input', (e) => {
      state.query = e.target.value;
      const el = e.target;
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 120) + 'px';
      el.style.overflow = el.scrollHeight > 120 ? 'auto' : 'hidden';
      renderTable();
      renderTrack();
      tick();
    });

    $('btnRefresh').addEventListener('click', () => loadData(false));

    $('inpId').addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      if (state.aksi === 'KEMBALI') { submit(); return; }
      $('inpUser').focus();
    });
    $('inpUser').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); $('inpZona').focus(); }
    });
    $('inpZona').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); submit(); }
    });
    $('btnSave').addEventListener('click', submit);

    function setBusy(on) {
      state.busy = on;
      const btn = $('btnSave');
      btn.disabled = on;
      btn.classList.toggle('is-loading', on);
      $('btnSpinner').classList.toggle('hidden', !on);
      $('btnLabel').textContent = on ? 'Menyinkronkan ke cloud…' : 'Simpan ke Cloud Database';
      ['inpId', 'inpUser', 'inpZona', 'btnCamera'].forEach((id) => { $(id).disabled = on; });
    }

    async function submit() {
      if (state.busy) return;

      const id = $('inpId').value.trim().toUpperCase();
      const user = $('inpUser').value.trim();
      const zona = $('inpZona').value.trim();
      const label = JENIS_LABEL[state.jenis];

      if (!id) {
        showModal({ type: 'error', title: 'ID asset kosong', message: 'Scan atau ketik ID ' + label + ' terlebih dahulu.' });
        return;
      }
      if (state.aksi === 'PINJAM' && (!user || !zona)) {
        showModal({ type: 'error', title: 'Data belum lengkap', message: 'User / PIC dan Zona wajib diisi saat meminjam ' + label + ' ' + id + '.' });
        return;
      }

      setBusy(true);
      try {
        const res = await apiScan({ id: id, jenis: state.jenis, aksi: state.aksi, user: user, zona: zona });

        if (res && res.success) {
          const d = res.data || {};
          const p = fmtDateParts(d.ts || Date.now());
          showModal({
            type: 'success',
            title: state.aksi === 'PINJAM' ? 'Peminjaman tercatat' : 'Pengembalian tercatat',
            message: res.message,
            details: [
              ['Asset', label + ' ' + (d.id || id)],
              ['Status', d.aksi || state.aksi],
              ['PIC', d.user || user || '-'],
              ['Zona', d.zona || zona || '-'],
              ['Waktu', p.date + ' ' + p.time + ' WIB']
            ]
          });
          if (user) store('amp_user', user);
          if (zona) store('amp_zona', zona);
          $('inpId').value = '';
          state.filter = state.jenis;
          loadData(true);
        } else {
          const msg = res && res.message ? res.message : 'Data gagal disimpan.';
          const titles = {
            DOUBLE_PINJAM: 'Belum dikembalikan',
            DOUBLE_KEMBALI: 'Sudah berstatus kembali',
            NOT_BORROWED: 'Belum pernah dipinjam',
            JENIS_MISMATCH: 'Kategori tidak sesuai',
            INVALID: 'Data tidak valid',
            BUSY: 'Server sedang sibuk'
          };
          showModal({ type: 'error', title: titles[res && res.code] || 'Gagal menyimpan', message: msg });
          loadData(true);
        }
      } catch (err) {
        showModal({ type: 'error', title: 'Koneksi gagal', message: 'Data belum tersimpan. ' + err.message + ' Periksa koneksi lalu coba lagi.' });
      } finally {
        setBusy(false);
      }
    }

    /* ------------------------- Scanner kamera belakang ------------------------- */
    let scanner = null;
    let scanToken = 0;
    let scanDecoded = false;
    let torchFeature = null;
    let torchOn = false;

    function scanFormats() {
      const F = window.Html5QrcodeSupportedFormats;
      if (!F) return undefined;
      return [F.QR_CODE, F.CODE_128, F.CODE_39, F.CODE_93, F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.ITF];
    }

    function scanErrorMessage(err) {
      const name = err && err.name ? err.name : '';
      const text = String(err && err.message ? err.message : err || '');
      const inFrame = window.self !== window.top;
      if (name === 'NotAllowedError' || /permission|denied|NotAllowed/i.test(text)) {
        return inFrame
          ? 'Izin kamera diblokir karena halaman dibuka di dalam Apps Script. Buka index.html lewat hosting HTTPS (misal GitHub Pages) agar kamera bisa dipakai.'
          : 'Izin kamera ditolak. Aktifkan izin kamera untuk situs ini di pengaturan browser, lalu coba lagi.';
      }
      if (name === 'NotFoundError' || /not ?found|no camera/i.test(text)) return 'Kamera tidak ditemukan di perangkat ini.';
      if (name === 'NotReadableError' || /not ?readable|in use/i.test(text)) return 'Kamera sedang dipakai aplikasi lain. Tutup aplikasi tersebut lalu coba lagi.';
      return 'Kamera tidak bisa dibuka. ' + text;
    }

    async function startCamera(cameraConfig, token) {
      const config = {
        fps: 10,
        qrbox: (w, h) => {
          const bw = Math.floor(w * 0.85);
          const bh = Math.max(110, Math.floor(Math.min(h * 0.6, bw * 0.55)));
          return { width: bw, height: bh };
        }
      };
      await scanner.start(cameraConfig, config, onScanDecoded, function () { /* frame tanpa kode, abaikan */ });
      if (token !== scanToken) {
        try { await scanner.stop(); } catch (e) { /* diabaikan */ }
        return false;
      }
      return true;
    }

    async function openScanner() {
      if (state.busy) return;
      if (typeof Html5Qrcode === 'undefined') {
        showModal({ type: 'error', title: 'Pemindai belum siap', message: 'Library kamera gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.' });
        return;
      }
      if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showModal({ type: 'error', title: 'Kamera tidak tersedia', message: 'Kamera hanya bisa dipakai pada halaman HTTPS. Buka index.html lewat hosting HTTPS seperti GitHub Pages.' });
        return;
      }

      const token = ++scanToken;
      scanDecoded = false;
      torchFeature = null;
      torchOn = false;
      $('btnTorch').classList.add('hidden');
      $('btnTorch').textContent = 'Nyalakan lampu';
      $('scanLine').classList.add('hidden');
      $('scanStatus').textContent = 'Membuka kamera belakang…';
      const ov = $('scanOverlay');
      ov.classList.remove('closing', 'hidden');

      try {
        scanner = new Html5Qrcode('reader', { formatsToSupport: scanFormats(), useBarCodeDetectorIfSupported: true, verbose: false });
        let ok;
        try {
          ok = await startCamera({ facingMode: 'environment' }, token);
        } catch (firstErr) {
          // Fallback: cari kamera belakang dari daftar perangkat
          const cams = await Html5Qrcode.getCameras();
          if (!cams || !cams.length) throw firstErr;
          const back = cams.find((c) => /back|rear|belakang|environment/i.test(c.label)) || cams[cams.length - 1];
          ok = await startCamera(back.id, token);
        }
        if (!ok) return;

        $('scanStatus').textContent = 'Arahkan kamera ke barcode atau QR pada asset.';
        $('scanLine').classList.remove('hidden');
        try {
          const feature = scanner.getRunningTrackCameraCapabilities().torchFeature();
          if (feature && feature.isSupported()) {
            torchFeature = feature;
            $('btnTorch').classList.remove('hidden');
          }
        } catch (e) { /* lampu tidak didukung */ }
      } catch (err) {
        await closeScanner();
        showModal({ type: 'error', title: 'Kamera gagal dibuka', message: scanErrorMessage(err) });
      }
    }

    async function closeScanner() {
      scanToken++;
      const ov = $('scanOverlay');
      const sc = scanner;
      scanner = null;
      torchFeature = null;
      torchOn = false;
      $('scanLine').classList.add('hidden');
      $('btnTorch').classList.add('hidden');

      if (sc) {
        try { await sc.stop(); } catch (e) { /* belum berjalan */ }
        try { sc.clear(); } catch (e) { /* diabaikan */ }
      }
      if (ov.classList.contains('hidden') || ov.classList.contains('closing')) return;
      ov.classList.add('closing');
      setTimeout(() => {
        ov.classList.add('hidden');
        ov.classList.remove('closing');
      }, 210);
    }

    async function onScanDecoded(text) {
      if (scanDecoded) return;
      scanDecoded = true;
      const code = String(text || '').trim().toUpperCase();
      if (!code) { scanDecoded = false; return; }

      if (navigator.vibrate) navigator.vibrate(70);
      $('inpId').value = code;
      await closeScanner();

      const complete = state.aksi === 'KEMBALI' || ($('inpUser').value.trim() && $('inpZona').value.trim());
      if (complete && $('chkAuto').checked) {
        submit();
      } else if (!complete) {
        ($('inpUser').value.trim() ? $('inpZona') : $('inpUser')).focus();
      } else {
        $('btnSave').focus();
      }
    }

    $('btnCamera').addEventListener('click', openScanner);
    $('btnScanClose').addEventListener('click', closeScanner);
    $('scanBackdrop').addEventListener('click', closeScanner);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeScanner(); });
    $('chkAuto').addEventListener('change', (e) => store('amp_auto', e.target.checked ? '1' : '0'));
    $('btnTorch').addEventListener('click', async () => {
      if (!torchFeature) return;
      try {
        torchOn = !torchOn;
        await torchFeature.apply(torchOn);
        $('btnTorch').textContent = torchOn ? 'Matikan lampu' : 'Nyalakan lampu';
      } catch (e) {
        torchOn = false;
        $('btnTorch').classList.add('hidden');
      }
    });

    /* ------------------------- Inisialisasi ------------------------- */
    (function init() {
      $('inpUser').value = load('amp_user');
      $('inpZona').value = load('amp_zona');
      $('chkAuto').checked = load('amp_auto') === '1';
      paintSegments();
      renderTabs();
      renderSkeleton();
      setInterval(tick, 1000);
      setInterval(() => { if (!document.hidden && !state.busy) loadData(true); }, AUTO_REFRESH_MS);
      document.addEventListener('visibilitychange', () => { if (!document.hidden && !state.busy) loadData(true); });
      loadData(false);
      $('inpId').focus();
    })();
  </script>
</body>
</html>
